name: Deploy the Android app to Playstore internal track
on:
  workflow_dispatch:
    inputs:
      version:
        description: Build version (eg 0.30.0)
        required: true
      message:
        description: Change logs
        required: false
jobs:
  build:
    runs-on: [ self-hosted, internal-chplay ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v2
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.2"
          channel: stable

      # Install jq for JSON processing (required by the version bump script)
      - name: Install dependencies
        run: |
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      # Get current version from Play Store
      - name: Get current build number from Play Store
        id: current_version
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          chmod +x ./scripts/get_playstore_version.sh
          ./scripts/get_playstore_version.sh

      # Bump the version number and set environment variables
      - name: Calculate new build number and set environment
        id: new_version
        run: |
          CURRENT_BUILD=${{ steps.current_version.outputs.current_build_number }}
          NEW_BUILD=$((CURRENT_BUILD + 1))
          
          # Export for later steps
          echo "new_build_number=$NEW_BUILD" >> $GITHUB_OUTPUT
          
          # Display version info
          echo "========================================="
          echo "Building version: ${{ github.event.inputs.version }}+${NEW_BUILD}"
          echo "Previous build number: ${CURRENT_BUILD}"
          echo "New build number: ${NEW_BUILD}"
          echo "========================================="
          
          # Set environment variables
          echo "FLUTTER_VERSION_NAME=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "FLUTTER_VERSION_CODE=${NEW_BUILD}" >> $GITHUB_ENV
          echo "SIGNATURE_HASH=${{ secrets.SIGNATURE_HASH }}" >> $GITHUB_ENV
          echo "SIGNATURE_HASH_INHOUSE=${{ secrets.SIGNATURE_HASH_INHOUSE }}" >> $GITHUB_ENV
          echo "NAME_SUFFIX=main-${NEW_BUILD}" >> $GITHUB_ENV

      - uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: |
            ${{ secrets.KEY_VAULT_DEPLOYMENT_KEY }}
            ${{ secrets.SSH_ASSETS_KEY }}

      - name: Create env file
        run: |
          touch .env
          echo -e "${{ secrets.PRODUCTION_ENV_VARS }}" | sed 's/\\n/\n/g' >> .env
          cat .env

      - name: Submodules update
        run: git -c submodule.auto-test.update=none submodule update --init --recursive
      - run: flutter pub cache repair
      - run: flutter pub get

      - name: Clone the Key Vault
        run: |
          git clone git@github.com:bitmark-inc/mobile-signing-key-vault.git --depth 1
          cp mobile-signing-key-vault/android/bitmark-autonomy/release.keystore android/release.keystore
          cp mobile-signing-key-vault/android/bitmark-autonomy/release.properties android/release.properties

      - run: flutter build appbundle --flavor production --release

      - name: Release notes
        run: |
          mkdir whatsnew
          echo "${{ github.event.inputs.message }}" > ./whatsnew/whatsnew-en-US

      # Upload AAB to Google Play Internal Testing track
      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.feralfile.app
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          track: internal
          mappingFile: build/app/outputs/mapping/productionRelease/mapping.txt
          debugSymbols: build/app/intermediates/merged_native_libs/productionRelease/out/lib
          whatsNewDirectory: ./whatsnew
